name: Update data and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays after the market closes (filings refresh weekly)
  workflow_dispatch:
    inputs:
      refresh_filings:
        description: "Re-download every company's SEC filings now (takes about 10 minutes)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install helper
        run: npm install --no-audit --no-fund

      # Keeps last week's SEC data and the last good prices between runs.
      - uses: actions/cache@v4
        with:
          path: cache
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Build the site and its data
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          FORCE_FUNDAMENTALS: ${{ inputs.refresh_filings }}
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
