name: Update data and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays after the market closes: new prices (filings refresh weekly)
  workflow_dispatch:
    inputs:
      refresh_filings:
        description: "Re-download every company's SEC filings now (takes a few minutes)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update SEC filings (weekly, or when asked)
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          FORCE_FUNDAMENTALS: ${{ inputs.refresh_filings }}
        run: node scripts/update-fundamentals.mjs

      - name: Update prices
        run: node scripts/update-prices.mjs

      - name: Save the new data to the repository
        run: |
          git config user.name "investor-panel-bot"
          git config user.email "investor-panel-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Update S&P 500 data"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
